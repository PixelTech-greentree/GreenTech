name: greenify
description: Greenify - Ekologik daraxt ekish ilovasi

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  provider: ^6.1.1
  flutter_animate: ^4.3.0
  
  # API & Storage
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  
  # Location & Maps
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # Camera & Media
  image_picker: ^1.0.4
  video_player: ^2.8.2
  
  # Utils
  intl: ^0.18.1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/intro/
    - assets/logo/
